<section class="hero hero--page">
  <div class="hero__bg"><img src="/assets/img/hero-page.svg" alt="" aria-hidden="true" fetchpriority="high"></div>
  <div class="container hero__inner">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="/">Home</a><span aria-hidden="true">/</span><span>{{ title }}</span>
    </nav>
    <h1>{{ heroTitle }}</h1>
    <p class="hero__sub">{{ heroText }}</p>
  </div>
</section>
